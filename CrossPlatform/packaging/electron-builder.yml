appId: io.github.dnspyex.dnspy
productName: dnSpy
copyright: Copyright (C) 2014-2020 de4dot@gmail.com and contributors
asar: true
electronFuses:
  runAsNode: false
  enableCookieEncryption: true
  enableNodeOptionsEnvironmentVariable: false
  enableNodeCliInspectArguments: false
  enableEmbeddedAsarIntegrityValidation: true
  onlyLoadAppFromAsar: true
  grantFileProtocolExtraPrivileges: false
directories:
  output: ../artifacts/packages
files:
  - out/**/*
  - package.json
extraResources:
  - from: ../artifacts/publish/backend
    to: backend
  - from: ../packaging/licenses
    to: licenses
  - from: ../artifacts/sbom
    to: licenses
  - from: ../../LICENSE.txt
    to: licenses/dnSpy-GPL-3.0.txt
linux:
  category: Development
  executableName: dnspy
  maintainer: dnSpyEx contributors <dnspyex@users.noreply.github.com>
  syncDesktopName: true
  icon: ../packaging/linux/icons
  synopsis: .NET assembly browser, editor and debugger
  description: Cross-platform .NET assembly browser, decompiler, editor and debugger.
  desktop:
    entry:
      Name: dnSpy
      Comment: Browse, edit and debug .NET assemblies
      Categories: Development;Debugger;
  target:
    - AppImage
    - deb
artifactName: dnSpy-${version}-${arch}.${ext}
win:
  executableName: dnSpy
  # A PNG source: electron-builder converts it to the .ico the installers want. Sharing one icon file
  # across all three platforms is why the Windows and macOS icons look like Linux's.
  icon: ../packaging/icons/icon.png
  target:
    - nsis
    - zip
nsis:
  oneClick: false
  perMachine: false
  allowToChangeInstallationDirectory: true
  artifactName: dnSpy-${version}-${arch}-setup.${ext}
mac:
  executableName: dnSpy
  icon: ../packaging/icons/icon.png
  category: public.app-category.developer-tools
  target:
    - dmg
    - zip
  # Apple silicon will not launch a bundle that carries no signature at all, and `null` means exactly
  # that — electron-builder does not fall back to an ad-hoc signature on its own. `-` asks for an
  # ad-hoc one, which is enough to launch. It must be paired with hardenedRuntime: false, because a
  # hardened runtime validates every library the process loads and would then need the
  # disable-library-validation entitlement to load the backend's own dylib.
  identity: "-"
  hardenedRuntime: false
deb:
  depends:
    - libgtk-3-0
    - libnotify4
    - libnss3
    - libxss1
    - libxtst6
    - xdg-utils
    - libatspi2.0-0
    - libuuid1
    - libsecret-1-0
    - libicu76 | libicu74 | libicu72
